app = "ai-bot"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[env]
  PYTHON_VERSION = "3.11"
  # Scaled up to the practical limit for Fly's free shared-cpu-1x machine.
  # This keeps a run under ~5 minutes on Fly while still giving the GA room to evolve.
  POPULATION_SIZE = "50"
  NUM_GENERATIONS = "12"
  DATA_LIMIT = "300"
