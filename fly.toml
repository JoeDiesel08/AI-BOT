# fly.toml app configuration file generated for ai-bot-0a2brw on 2026-07-24T18:34:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-bot-0a2brw'
primary_region = 'ams'

[build]

[env]
  DATA_LIMIT = '200'
  KRAKEN_FEE_MAKER = '0.0025'
  KRAKEN_FEE_TAKER = '0.0040'
  KRAKEN_SLIPPAGE = '0.0005'
  KRAKEN_VALIDATE = 'true'
  LOOP_INTERVAL_SECONDS = '300'
  MODE = 'paper'
  NUM_GENERATIONS = '12'
  PAPER_CASH = '1000.0'
  PAPER_CRYPTO = '0.0'
  PAPER_TRADING = 'true'
  POPULATION_SIZE = '50'
  PYTHON_VERSION = '3.11'
  RISK_PENALTY = '0.5'
  SEED_FILE = '/data/best_agent.json'
  TIMEFRAME = '4h'
  TRADING_PAIR = 'BTC/USD'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
